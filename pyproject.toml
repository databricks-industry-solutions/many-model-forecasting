[project]
name = "mmf_sa"
version = "0.0.1"
dependencies = [
    "omegaconf==2.3.0",
    "sktime==0.40.1",
    "mlflow>=3.15.0",
]

[project.optional-dependencies]
local = [
    "statsforecast==2.0.0",
    "prophet==1.1.6",
    "cmdstanpy==1.2.5",
]
global = [
    "pandas==2.2.3",
    "neuralforecast==3.1.4",
    "mlforecast==1.0.31",
    "lightgbm==4.6.0",
    "optuna==3.6.1",
]
foundation = [
    "timesfm[torch,xreg] @ https://github.com/google-research/timesfm/archive/a83dbf3f163cf15993dac6a45bbb5dcb160e14e8.tar.gz",
    "chronos-forecasting==2.2.2",
    "utilsforecast==0.2.15",
]
# PyPI's torch 2.11.0 wheel targets CUDA 13 (NVIDIA driver 580+). Package metadata can't name an
# index, so add --extra-index-url https://download.pytorch.org/whl/cu128 to get the CUDA 12.8 build.
foundationforecast = [
    "foundationforecast==0.1.10",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.12.1",
    "huggingface-hub==1.33.0",
    "granite-tsfm==0.3.10",
    "timecopilot-chronos-forecasting==0.2.2",
    "timecopilot-timesfm==0.4.0",
    "timecopilot-tirex2==0.1.0",
    "timecopilot-toto==0.1.7",
    "timecopilot-toto-2==0.1.1",
    "tafsut==0.1.0",
    "tfc-t0==0.5.0",
]
hierarchical = [
    "hierarchicalforecast==1.5.1",
    "polars>=0.20.0",
    "scipy>=1.10.0",
]
tests = [
    "setuptools",
    "wheel",
    "pyyaml",
    "pytest",
    "pytest-cov",
    "pyspark==3.4.4",
    "PyArrow>=1.0.0",
    "sqlalchemy",
    "alembic",
    "hyperopt",
    "plotly",
    "black",
    "datasetsforecast",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "mmf_sa/",
]
exclude = [
    "/tests",
]
