  StatsForecastAutoArima:
    module: mmf_sa.models.statsforecast.StatsFcForecastingPipeline
    model_class: StatsFcAutoArima
    framework: StatsForecast
    model_type: local
    model_spec:
      season_length: 7
      approximation: false

  StatsForecastAutoETS:
    module: mmf_sa.models.statsforecast.StatsFcForecastingPipeline
    model_class: StatsFcAutoETS
    framework: StatsForecast
    model_type: local
    model_spec:
      season_length: 7
      model: "ZZZ"

  StatsForecastAutoCES:
    module: mmf_sa.models.statsforecast.StatsFcForecastingPipeline
    model_class: StatsFcAutoCES
    framework: StatsForecast
    model_type: local
    model_spec:
      season_length: 7
      model: "Z"

  StatsForecastAutoTheta:
    module: mmf_sa.models.statsforecast.StatsFcForecastingPipeline
    model_class: StatsFcAutoTheta
    framework: StatsForecast
    model_type: local
    model_spec:
      season_length: 7
      decomposition_type: "multiplicative"

  StatsForecastAutoTbats:
    module: mmf_sa.models.statsforecast.StatsFcForecastingPipeline
    model_class: StatsFcAutoTbats
    framework: StatsForecast
    model_type: local
    model_spec:
      season_length: 7
      use_boxcox: true
      bc_lower_bound: 0.0
      bc_upper_bound: 1.0
      use_trend: true
      use_damped_trend: true
      use_arma_errors: true

  StatsForecastAutoMfles:
    module: mmf_sa.models.statsforecast.StatsFcForecastingPipeline
    model_class: StatsFcAutoMfles
