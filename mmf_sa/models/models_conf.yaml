    model_class: StatsFcTSB
    framework: StatsForecast
    model_type: local
    model_spec:
      alpha_d: 0.2
      alpha_p: 0.2

  StatsForecastADIDA:
    module: mmf_sa.models.statsforecast.StatsFcForecastingPipeline
    model_class: StatsFcADIDA
    framework: StatsForecast
    model_type: local
    model_spec:

  StatsForecastIMAPA:
    module: mmf_sa.models.statsforecast.StatsFcForecastingPipeline
    model_class: StatsFcIMAPA
    framework: StatsForecast
    model_type: local
    model_spec:

  StatsForecastCrostonClassic:
    module: mmf_sa.models.statsforecast.StatsFcForecastingPipeline
