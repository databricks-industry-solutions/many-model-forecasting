freq: D

metric: smape

resample: false

train_predict_ratio: 1

accelerator: cpu

static_features:
  #- State

dynamic_future_numerical:

dynamic_future_categorical:
  #- Open
  #- Promo
  #- DayOfWeek

dynamic_historical_numerical:

dynamic_historical_categorical:

# Prediction intervals (docs/specs/confidence_interval.md, section 7.3). Disabled by default.
# Override with run_forecast(prediction_intervals={...}).
prediction_intervals:
  enabled: false
  levels: [80, 95]            # central interval levels; or set `quantiles` instead
  quantiles:                  # e.g. [0.1, 0.5, 0.9]; replaces `levels` when set
  method: auto                # auto (native + CQR if available, else conformal) | conformal | native | cqr
  cqr_score: asymmetric       # asymmetric | scaled | symmetric
  cqr_tail_split: adaptive    # adaptive | equal
  cqr_pool: group             # group | marginal | series
  coverage:
    target: series            # marginal | group | series
    group_col: auto           # auto (ABC x XYZ computed by MMF) | sb_class | <column> | [col1, col2] | null
    level_group_col:          # e.g. abc_class; drives levels_by_group
    min_scores_per_group: 100 # smaller groups are merged into one "other" pool
    levels_by_group:          # e.g. {A: [95], B: [90], C: [80]}; overrides `levels`
    shrinkage_kappa: 10       # series target: q_i = lam*q_series + (1-lam)*q_group, lam = W/(W+kappa)
    pool_horizon: auto        # series target: pool horizon steps within a series (auto = if W < 19)
  score: signed_normalized    # abs | signed | signed_normalized
  recency_decay:              # e.g. 0.9 per window (weighted conformal)
  clip_lower: auto            # auto | none | <number>
  output_format: quantile_map # quantile_map | lo_hi | both

active_models:
  - StatsForecastBaselineWindowAverage
  - StatsForecastBaselineSeasonalWindowAverage
  - StatsForecastBaselineNaive
  - StatsForecastBaselineSeasonalNaive
  - StatsForecastAutoArima
  - StatsForecastAutoETS
  - StatsForecastAutoCES
  - StatsForecastAutoTheta
  - StatsForecastTSB
  - StatsForecastADIDA
  - StatsForecastIMAPA
  - StatsForecastCrostonClassic
  - StatsForecastCrostonOptimized
  - StatsForecastCrostonSBA
  - SKTimeProphet
  - NeuralForecastRNN
  - NeuralForecastLSTM
  - NeuralForecastNBEATSx
  - NeuralForecastNHITS
  - NeuralForecastAutoRNN
  - NeuralForecastAutoLSTM
  - NeuralForecastAutoNBEATSx
  - NeuralForecastAutoNHITS
  - NeuralForecastAutoTiDE
  - NeuralForecastAutoPatchTST
  - ChronosBoltTiny
  - ChronosBoltMini
  - ChronosBoltSmall
  - ChronosBoltBase
  - Chronos2
  - Chronos2Small
  - Chronos2Synth
  - TimesFM_2_5_200m
  - MLForecastLGBM
  - MLForecastAutoLGBM

#Here we can override hyperparameters for built-in models
models:

  StatsForecastBaselineWindowAverage:
    model_spec:
      window_size: 7

  StatsForecastBaselineSeasonalWindowAverage:
    model_spec:
      season_length: 7
      window_size: 3

  StatsForecastBaselineSeasonalNaive:
    model_spec:
      season_length: 7

  StatsForecastAutoArima:
    model_spec:
      season_length: 7
      approximation:
      level:

  StatsForecastAutoETS:
    model_spec:
      season_length: 7
      model: "ZNZ"

  StatsForecastAutoCES:
    model_spec:
      season_length: 7
      model: "Z"

  StatsForecastAutoTheta:
    model_spec:
      season_length: 7
      decomposition_type: "multiplicative"

  MLForecastLGBM:
    features:
      lags: [1, 7, 14, 28]
      date_features: ["dayofweek", "month"]
      target_transforms: ["differences_1"]
      lag_transforms:
        1: ["rolling_mean_7", "rolling_mean_28"]
        7: ["rolling_mean_28"]

  MLForecastAutoLGBM:
    season_length: 7
    feature_space:
      lags:
        - [1, 7]
        - [1, 7, 14]
        - [1, 7, 14, 28]
      date_features:
        - ["dayofweek"]
        - ["dayofweek", "month"]
      target_transforms:
        - "none"
        - "differences_1"
      lag_transforms:
        - "none"
        - "rolling_mean_7"
        - "rolling_mean_28"

temp_path: /Volumes/mmf/tmp/partitions