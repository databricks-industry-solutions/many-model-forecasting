freq: W

metric: smape

resample: false

train_predict_ratio: 1

accelerator: cpu

static_features:
  #- State

dynamic_future_numerical:

dynamic_future_categorical:
  #- Open
  #- Promo
  #- DayOfWeek

dynamic_historical_numerical:

dynamic_historical_categorical:

# Prediction intervals (see the "Prediction Intervals" section of the README). Disabled by default.
# Override with run_forecast(prediction_intervals={...}). The bands are the models' native, uncalibrated ones;
# models without native intervals get NULL interval columns.
prediction_intervals:
  enabled: false
  levels: [80, 95]            # central interval levels; or set `quantiles` instead
  quantiles:                  # e.g. [0.1, 0.5, 0.9]; replaces `levels` when set
  output_format: quantile_map # quantile_map | lo_hi | both

active_models:
  - StatsForecastBaselineWindowAverage
  - StatsForecastBaselineSeasonalWindowAverage
  - StatsForecastBaselineNaive
  - StatsForecastBaselineSeasonalNaive
  - StatsForecastAutoArima
  - StatsForecastAutoETS
  - StatsForecastAutoCES
  - StatsForecastAutoTheta
  - StatsForecastTSB
  - StatsForecastADIDA
  - StatsForecastIMAPA
  - StatsForecastCrostonClassic
  - StatsForecastCrostonOptimized
  - StatsForecastCrostonSBA
  - SKTimeProphet
  - NeuralForecastRNN
  - NeuralForecastLSTM
  - NeuralForecastNBEATSx
  - NeuralForecastNHITS
  - NeuralForecastAutoRNN
  - NeuralForecastAutoLSTM
  - NeuralForecastAutoNBEATSx
  - NeuralForecastAutoNHITS
  - NeuralForecastAutoTiDE
  - NeuralForecastAutoPatchTST
  - ChronosBoltTiny
  - ChronosBoltMini
  - ChronosBoltSmall
  - ChronosBoltBase
  - Chronos2
  - Chronos2Small
  - Chronos2Synth
  - TimesFM_2_5_200m
  - MLForecastLGBM
  - MLForecastAutoLGBM

#Here we can override hyperparameters for built-in models
models:

  StatsForecastBaselineWindowAverage:
    model_spec:
      window_size: 4

  StatsForecastBaselineSeasonalWindowAverage:
    model_spec:
      season_length: 4
      window_size: 3

  StatsForecastBaselineSeasonalNaive:
    model_spec:
      season_length: 4

  StatsForecastAutoArima:
    model_spec:
      season_length: 4
      approximation:
      level:

  StatsForecastAutoETS:
    model_spec:
      season_length: 4
      model: "ZNZ"

  StatsForecastAutoCES:
    model_spec:
      season_length: 4
      model: "Z"

  StatsForecastAutoTheta:
    model_spec:
      season_length: 4
      decomposition_type: "multiplicative"

  MLForecastLGBM:
    features:
      lags: [1, 4, 13, 26, 52]
      date_features: ["week", "month"]
      target_transforms: ["differences_1"]
      lag_transforms:
        1: ["rolling_mean_4", "rolling_mean_13"]

  MLForecastAutoLGBM:
    season_length: 52
    feature_space:
      lags:
        - [1, 4, 13]
        - [1, 4, 13, 26]
        - [1, 4, 13, 26, 52]
      date_features:
        - ["week"]
        - ["week", "month"]
      target_transforms:
        - "none"
        - "differences_1"
      lag_transforms:
        - "none"
        - "rolling_mean_4"
        - "rolling_mean_13"

temp_path: /Volumes/mmf/tmp/partitions