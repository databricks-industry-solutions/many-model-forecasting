# Serverless GPU environment equivalent to AI v6 (environment version 6 with the AI v6 package pins),
# using public package indexes. Use it as the job's base_environment only when the workspace's Jobs API
# rejects workspace-base-environments/databricks_ai_v6: upload it to the workspace and pass its
# /Workspace/... path (Skill 4 Step 5b).
environment_version: "6"
dependencies:
